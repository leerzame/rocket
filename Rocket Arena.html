<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Arena</title>
<style>
:root{color-scheme:dark;--bg:#0a0e1a;--tx:#fff;--blue:#1e90ff;--org:#ff8a1e}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Impact,"Arial Black",sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding-top:8px}
.sc{min-width:64px;padding:4px 16px;font-size:34px;text-align:center}
#b{background:rgba(30,144,255,.85);border-radius:8px 0 0 8px}#o{background:rgba(255,138,30,.85);border-radius:0 8px 8px 0}
#t{background:rgba(0,0,0,.7);font-size:26px;padding:8px 14px;min-width:80px;text-align:center}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:min(14vw,110px);text-shadow:0 0 30px #000;pointer-events:none;text-align:center}
#msg small{font-size:20px;font-family:Arial,sans-serif;margin-top:10px;opacity:.85}
#boost{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:90px;height:90px;border-radius:50%;background:conic-gradient(#ffb020 var(--p,100%),rgba(255,255,255,.15) 0);display:flex;align-items:center;justify-content:center;pointer-events:none}
#boost i{width:70px;height:70px;border-radius:50%;background:#0a0e1a;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px}
#help{position:fixed;left:12px;bottom:12px;font:12px Arial,sans-serif;opacity:.7;line-height:1.5}
#touch{display:none}
@media (pointer:coarse){#help{display:none}#touch{display:block}}
#touch button{position:fixed;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;font:bold 13px Arial,sans-serif}
#touch button.on{background:rgba(255,255,255,.45)}
</style></head><body>
<div id="hud"><div class="sc" id="b">0</div><div id="t">5:00</div><div class="sc" id="o">0</div></div>
<div id="msg"></div>
<div id="boost"><i id="bv">100</i></div>
<div id="help">W/S drive · A/D steer · SPACE jump · SHIFT boost · C ball cam · R restart</div>
<div id="touch">
<button data-k="a" style="left:14px;bottom:100px">◀</button><button data-k="d" style="left:90px;bottom:100px">▶</button>
<button data-k="s" style="left:14px;bottom:24px">BRAKE</button><button data-k="w" style="left:90px;bottom:24px">GAS</button>
<button data-k=" " style="right:120px;bottom:24px">JUMP</button><button data-k="c" style="right:120px;bottom:100px">CAM</button>
<button data-k="shift" style="right:20px;bottom:120px;width:70px;height:70px;border-radius:50%;display:none" id="tb"></button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=40,L=60,H=30,GW=11,GH=9,BR=2.2;
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e1a);scene.fog=new THREE.Fog(0x0a0e1a,80,220);
const cam=new THREE.PerspectiveCamera(70,1,.5,500);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xbbd0ff,0x223322,.8));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(20,60,10);scene.add(sun);
[[-30,-40],[30,-40],[-30,40],[30,40]].forEach(p=>{const l=new THREE.PointLight(0xffffff,.5,120);l.position.set(p[0],28,p[1]);scene.add(l)});

// Field
const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
g.fillStyle='#1f7a3a';g.fillRect(0,0,256,256);g.fillStyle='#248a42';g.fillRect(0,0,256,128);
const ft=new THREE.CanvasTexture(c);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(4,6);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W*2,L*2),new THREE.MeshLambertMaterial({map:ft}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const lm=new THREE.MeshBasicMaterial({color:0xffffff});
function line(w,d,x,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),lm);m.rotation.x=-Math.PI/2;m.position.set(x,.05,z);scene.add(m)}
line(W*2,.4,0,0);line(.4,L*2,-W+.2,0);line(.4,L*2,W-.2,0);
const ring=new THREE.Mesh(new THREE.RingGeometry(9,9.4,48),lm);ring.rotation.x=-Math.PI/2;ring.position.y=.05;scene.add(ring);
[-1,1].forEach(s=>{line(GW*3.2,.4,0,s*(L-12));line(.4,12,-GW*1.6,s*(L-6));line(.4,12,GW*1.6,s*(L-6))});

// Walls
const wmat=new THREE.MeshLambertMaterial({color:0x2a3a66,transparent:true,opacity:.45});
function box(w,h,d,x,y,z,m){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);scene.add(b);return b}
[-1,1].forEach(s=>{
  box(1,H,L*2,s*(W+.5),H/2,0,wmat);
  const col=s<0?0x1e90ff:0xff8a1e;
  const bm=new THREE.MeshLambertMaterial({color:0x2a3a66,transparent:true,opacity:.45});
  box(W-GW,H,1,s*0+(-(W+GW)/2),H/2,s*(L+.5),bm);box(W-GW,H,1,(W+GW)/2,H/2,s*(L+.5),bm);
  box(GW*2,H-GH,1,0,GH+(H-GH)/2,s*(L+.5),bm);
  const gm=new THREE.MeshBasicMaterial({color:col,wireframe:true});
  box(GW*2,GH,10,0,GH/2,s*(L+5),gm);
  box(GW*2+1,.8,1,0,GH,s*L,new THREE.MeshBasicMaterial({color:col}));
  [-1,1].forEach(k=>box(.8,GH,1,k*GW,GH/2,s*L,new THREE.MeshBasicMaterial({color:col})));
  const gl=new THREE.PointLight(col,1.2,40);gl.position.set(0,5,s*(L+3));scene.add(gl);
});
box(W*2,.5,1,0,H,0,new THREE.MeshBasicMaterial({visible:false}));

// Cars
function makeCar(col){
  const grp=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:col});
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,4),m);body.position.y=.8;grp.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.8,.6,2),new THREE.MeshLambertMaterial({color:0x222a38}));cab.position.set(0,1.4,-.3);grp.add(cab);
  const spo=new THREE.Mesh(new THREE.BoxGeometry(2.2,.15,.6),m);spo.position.set(0,1.5,-1.8);grp.add(spo);
  const wm=new THREE.MeshLambertMaterial({color:0x111111});
  [[-1.2,1.3],[1.2,1.3],[-1.2,-1.3],[1.2,-1.3]].forEach(p=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.5,14),wm);w.rotation.z=Math.PI/2;w.position.set(p[0],.55,p[1]);grp.add(w)});
  const fl=new THREE.Mesh(new THREE.ConeGeometry(.6,3,10),new THREE.MeshBasicMaterial({color:0xffa030}));
  fl.rotation.x=-Math.PI/2;fl.position.set(0,.8,-3.4);fl.visible=false;grp.add(fl);
  scene.add(grp);
  return{g:grp,fl,x:0,y:0,z:0,vy:0,h:0,sp:0,boost:100,v:new THREE.Vector3(),ai:false};
}
const me=makeCar(0x1e90ff),bot=makeCar(0xff8a1e);bot.ai=true;

// Ball
const ball=new THREE.Mesh(new THREE.SphereGeometry(BR,24,18),new THREE.MeshStandardMaterial({color:0xf2f2f2,emissive:0x444444,roughness:.4}));
ball.add(new THREE.Mesh(new THREE.IcosahedronGeometry(BR*1.01,1),new THREE.MeshBasicMaterial({color:0x222222,wireframe:true})));
scene.add(ball);const bv=new THREE.Vector3();

// State
const K={};let score=[0,0],time=300,state='count',cd=3.2,ballCam=true,over=false;
function reset(){
  Object.assign(me,{x:0,y:0,z:-35,vy:0,h:0,sp:0,boost:34});
  Object.assign(bot,{x:0,y:0,z:35,vy:0,h:Math.PI,sp:0,boost:34});
  ball.position.set(0,BR,0);bv.set(0,0,0);state='count';cd=3.2;
}
function say(t,s){$('msg').innerHTML=t?t+(s?'<small>'+s+'</small>':''):''}
function restart(){score=[0,0];time=300;over=false;reset();$('b').textContent=$('o').textContent=0}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(k==='c')ballCam=!ballCam;if(k==='r')restart();if(k===' ')e.preventDefault()});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
document.querySelectorAll('#touch button[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{K[k]=1;b.classList.add('on');if(k==='c')ballCam=!ballCam});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{K[k]=0;b.classList.remove('on')}));
});
if(matchMedia('(pointer:coarse)').matches){const tb=$('tb');tb.style.display='block';tb.textContent='BOOST';
  tb.addEventListener('pointerdown',()=>{K.shift=1;tb.classList.add('on')});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>tb.addEventListener(ev,()=>{K.shift=0;tb.classList.remove('on')}));}
addEventListener('pointerdown',()=>{if(over)restart()});

function driveCar(c,inp,dt){
  const gr=c.y<=.01;
  const th=(inp.up?1:0)-(inp.down?1:0);
  const boosting=inp.boost&&c.boost>0;
  if(gr){
    if(th)c.sp+=(th>0?(c.sp<0?60:38):(c.sp>0?60:30))*th*dt;
    else c.sp*=1-1.6*dt;
    if(inp.jump){c.vy=11}
  }
  if(boosting){c.sp+=45*dt;c.boost=Math.max(0,c.boost-33*dt)}else c.boost=Math.min(100,c.boost+(gr?6:2)*dt);
  const max=boosting?52:28;c.sp=Math.max(-18,Math.min(max,c.sp));
  const turn=((inp.left?1:0)-(inp.right?1:0));
  c.h+=turn*dt*2.6*Math.max(-1,Math.min(1,c.sp/9))*(gr?1:.6);
  if(!gr||c.vy>0){c.vy-=30*dt}
  c.y+=c.vy*dt;if(c.y<0){c.y=0;c.vy=0}
  c.x+=Math.sin(c.h)*c.sp*dt;c.z+=Math.cos(c.h)*c.sp*dt;
  const lx=W-2.2,lz=L-2.2;
  if(Math.abs(c.x)>lx){c.x=Math.sign(c.x)*lx;c.sp*=.6}
  if(Math.abs(c.z)>lz){c.z=Math.sign(c.z)*lz;c.sp*=.6}
  c.v.set(Math.sin(c.h)*c.sp,c.vy,Math.cos(c.h)*c.sp);
  c.fl.visible=boosting;
  c.g.position.set(c.x,c.y,c.z);c.g.rotation.set(c.y>.05?-c.vy*.025:0,c.h,0,'YXZ');
}
function aiInput(c){
  const dg=new THREE.Vector2(0-ball.position.x,-L-ball.position.z).normalize();
  let tx=ball.position.x-dg.x*5,tz=ball.position.z-dg.y*5;
  if(c.z<ball.position.z+3){tx=ball.position.x*.5+(ball.position.x>c.x?-14:14);tz=ball.position.z+16}
  tx=Math.max(-W+4,Math.min(W-4,tx));tz=Math.max(-L+4,Math.min(L-4,tz));
  let a=Math.atan2(tx-c.x,tz-c.z)-c.h;a=Math.atan2(Math.sin(a),Math.cos(a));
  const d=Math.hypot(tx-c.x,tz-c.z),bd=Math.hypot(ball.position.x-c.x,ball.position.z-c.z);
  return{up:Math.abs(a)<1.8||d>10,down:false,left:a>.1,right:a<-.1,
    boost:Math.abs(a)<.25&&d>22&&c.boost>15,jump:bd<7&&ball.position.y>4&&c.y<.1&&Math.random()<.05};
}
function carBall(c){
  const cx=c.x,cy=c.y+1,cz=c.z,r=2.3;
  const d=new THREE.Vector3(ball.position.x-cx,ball.position.y-cy,ball.position.z-cz),dist=d.length();
  if(dist<r+BR&&dist>.001){
    const n=d.clone().divideScalar(dist);
    ball.position.set(cx,cy,cz).addScaledVector(n,r+BR);
    const rel=bv.clone().sub(c.v),vn=rel.dot(n);
    if(vn<0)bv.addScaledVector(n,-vn*1.3);
    bv.addScaledVector(c.v,.45);bv.y+=3+Math.abs(c.sp)*.08;
    if(bv.length()>75)bv.setLength(75);
  }
}
function goal(side){ // side 1 = blue scored (ball in +z goal)
  score[side>0?0:1]++;$('b').textContent=score[0];$('o').textContent=score[1];
  state='goal';cd=2.5;say('GOAL!',side>0?'Blue scores':'Orange scores');
}
function step(dt){
  const inp={up:K.w||K.arrowup,down:K.s||K.arrowdown,left:K.a||K.arrowleft,right:K.d||K.arrowright,boost:K.shift,jump:K[' ']};
  if(state==='count'){
    cd-=dt;const n=Math.ceil(cd);say(n>0?n:'GO!');
    if(cd<=0){state='play';say('')}
    else{driveCar(me,{},dt);driveCar(bot,{},dt)}
    return;
  }
  if(state==='goal'){cd-=dt;ball.position.addScaledVector(bv,dt);bv.multiplyScalar(.97);if(cd<=0){say('');reset()}return}
  if(over)return;
  time-=dt;
  if(time<=0){time=0;over=true;const w=score[0]>score[1]?'BLUE WINS':score[0]<score[1]?'ORANGE WINS':'DRAW';say(w,'Tap or press R to play again');return}
  driveCar(me,inp,dt);driveCar(bot,aiInput(bot),dt);
  bv.y-=25*dt;ball.position.addScaledVector(bv,dt);
  const p=ball.position;
  if(p.y<BR){p.y=BR;bv.y=Math.abs(bv.y)>3?-bv.y*.72:0;bv.x*=1-.35*dt;bv.z*=1-.35*dt}
  if(p.y>H-BR){p.y=H-BR;bv.y*=-.7}
  if(Math.abs(p.x)>W-BR){p.x=Math.sign(p.x)*(W-BR);bv.x*=-.8}
  const inMouth=Math.abs(p.x)<GW&&p.y<GH;
  if(Math.abs(p.z)>L-BR){
    if(inMouth){if(Math.abs(p.z)>L+BR){goal(p.z>0?1:-1);return}}
    else{p.z=Math.sign(p.z)*(L-BR);bv.z*=-.8}
  }
  carBall(me);carBall(bot);
  const m=Math.floor(time/60),s=Math.floor(time%60);$('t').textContent=m+':'+String(s).padStart(2,'0');
}
function updateCam(dt){
  const f=new THREE.Vector3(Math.sin(me.h),0,Math.cos(me.h));
  const mp=new THREE.Vector3(me.x,me.y,me.z);
  let dir=f.clone();
  if(ballCam){const d=new THREE.Vector3(ball.position.x-me.x,0,ball.position.z-me.z);if(d.length()>6)dir=d.normalize()}
  const target=mp.clone().addScaledVector(dir,-14);target.y=6.5+me.y*.5;
  cam.position.lerp(target,1-Math.pow(.0005,dt));
  const look=ballCam?ball.position.clone().lerp(mp.clone().addScaledVector(f,8),.25):mp.clone().addScaledVector(f,12);
  look.y=ballCam?Math.max(2,look.y*.7):2;
  cam.lookAt(look);
}
reset();cam.position.set(0,8,-50);
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  step(dt);
  ball.rotation.x+=bv.z*dt*.4;ball.rotation.z-=bv.x*dt*.4;ball.position.y=ball.position.y;
  updateCam(dt);
  const bs=me.boost;$('boost').style.setProperty('--p',bs+'%');$('bv').textContent=Math.round(bs);
  renderer.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
