const crowd=new THREE.InstancedMesh(new THREE.BoxGeometry(1.2,1.6,1.2),new THREE.MeshLambertMaterial({color:0xffffff}),900);
(()=>{const o=new THREE.Object3D();let n=0;
  for(let sd=-1;sd<=1;sd+=2)for(let r=0;r<6;r++)for(let k=0;k<75;k++){o.position.set(sd*(W+5+r*1.7),3+r*1.5,-L+k*1.6);o.updateMatrix();crowd.setMatrixAt(n++,o.matrix)}
  crowd.instanceMatrix.needsUpdate=true;scene.add(crowd)})();
const pads=[];
[[-28,-40,1],[28,-40,1],[-28,40,1],[28,40,1],[0,-22,0],[0,22,0],[-20,0,0],[20,0,0],[-14,-48,0],[14,-48,0],[-14,48,0],[14,48,0]].forEach(p=>{
  const m=new THREE.Mesh(new THREE.CylinderGeometry(p[2]?2:1.2,p[2]?2:1.2,.12,20),new THREE.MeshBasicMaterial({color:p[2]?0xffb020:0xffdd88}));
  m.position.set(p[0],.08,p[1]);scene.add(m);pads.push({m,x:p[0],z:p[1],big:p[2],cd:0})});
const BN=140,bpos=new Float32Array(BN*3),bvel=new Float32Array(BN*3);let blife=0;

burst.frustumCulled=false;burst.visible=false;scene.add(burst);

wmat.visible=false;let shell;
(()=>{
  const g=new THREE.BoxGeometry(2*W,H,2*L,48,24,72),pa=g.attributes.position,v=new THREE.Vector3(),c=new THREE.Vector3();

    if(!d||!d.from)return;const f=String(d.from).replace(/[^\w-]/g,'').slice(0,12);if(d.g)fgear[f]=d.g;
    if(d.t==='hi'){conns[f]=c}
    else if(d.t==='req'){conns[f]=c;if(!S.friends.includes(f)&&!reqs.includes(f))reqs.push(f)}
    else if(d.t==='acc'){conns[f]=c;if(!S.friends.includes(f))S.friends.push(f);save()}
    else if(d.t==='inv'){conns[f]=c;inv=f}
    else if(d.t==='join'){S.party=f;save()}
    refresh();
  });
  c.on('close',()=>{for(const k in conns)if(conns[k]===c)delete conns[k];refresh()});
}
function netStart(){
  netStop();if(!S.name)return;
  if(typeof Peer==='undefined'){pstat='offline';note='Network library not loaded. Friends need internet and a downloaded copy of this page.';return}
  pstat='connecting';
  try{PEER=new Peer(pid(S.name))}catch(e){pstat='offline';return}
  PEER.on('open',()=>{pstat='online';connectAll();refresh()});
  PEER.on('error',e=>{
    if(e.type==='unavailable-id'){note='That username is already online somewhere else.';S.name='';S.friends=[];netStop();save()}
    else if(e.type!=='peer-unavailable'){pstat='offline'}
    show(view);
  });
  PEER.on('connection',hook);
}
function connectTo(n,then){
  if(!PEER||pstat!=='online')return;
  if(conns[n]&&conns[n].open){if(then)then(conns[n]);return}
  const c=PEER.connect(pid(n),{reliable:true});hook(c);
  c.on('open',()=>{conns[n]=c;if(then)then(c);refresh()});
  return c;
}
function connectAll(){S.friends.forEach(n=>{if(!(conns[n]&&conns[n].open))connectTo(n)})}
setInterval(()=>{if(pstat==='online')connectAll()},10000);
function reqTo(n){
  let ok=false;
  connectTo(n,c=>{ok=true;c.send({t:'req',from:S.name});note='Friend request sent to '+n+'. They need to accept.';refresh()});
  setTimeout(()=>{if(!ok){note=n+' is not online. Both of you must be logged in.';refresh()}},5000);
}
let net=null,netT=0,geN=0,hc=null,snap=null,lastGe=0,jl=false;const fgear={};
const curInput=()=>({up:K.w||K.arrowup,down:K.s||K.arrowdown,left:K.a||K.arrowleft,right:K.d||K.arrowright,boost:K.shift,jump:K[' ']});
const r2=x=>Math.round(x*100)/100,_q=new THREE.Quaternion();
function startNet(){
  net=null;if(M.free||mode<2||!partyName||!conns[S.party]||!conns[S.party].open)return;
  const rc=cars.find(x=>x.team===0&&x.i===1);if(!rc)return;
  rc.ai=false;rc.remote=true;net='host';
  conns[S.party].send({t:'start',from:S.name,M:Object.assign({},M),n:mode,meIdx:cars.indexOf(rc),cars:cars.map(c=>({team:c.team,i:c.i,gear:c.gear,name:c===me?S.name:c===rc?'':c.name}))});
}
function hostSend(dt){
  netT+=dt;if(netT<.05)return;netT=0;
  const g=conns[S.party];if(!g||!g.open)return;
  g.send({t:'snap',st:state,m:$('msg').innerHTML,hb:$('b').textContent,ho:$('o').textContent,tt:$('t').textContent,ov:over,ge:geN,gs:gside,
    bl:[ball.position.x,ball.position.y,ball.position.z].map(r2),
    cars:cars.map(c=>{const q=c.g.quaternion,p=c.g.position;return[p.x,p.y,p.z,q.x,q.y,q.z,q.w,c.u.x,c.u.y,c.u.z,c.f.x,c.f.y,c.f.z,c.boost,c.fl.visible?1:0,c.air?1:0].map(r2)})});
}
function onStart(d,c){
  if(!d||!d.cars||!d.M)return;
  net='guest';M=Object.assign({},DEF,d.M);mode=d.n|0;snap=null;hc=c;
  cars.forEach(x=>scene.remove(x.g));cars=[];
  d.cars.slice(0,8).forEach((x,i)=>{const g0=x.gear||{},k=makeCar(x.team?1:0,{car:Math.max(0,Math.min(CARX.length-1,g0.car|0)),col:+g0.col||0x1e90ff,dec:String(g0.dec||'None'),ant:String(g0.ant||'None'),whl:String(g0.whl||'Standard'),fl:+g0.fl||0xffa030});k.i=x.i|0;k.ai=false;
    if(x.name){k.name=String(x.name).slice(0,12);k.g.add(tag(k.name,x.team))}
    cars.push(k);if(i===d.meIdx)me=k});
  if(!me)me=cars[0];
  score=[0,0];time=0;over=false;ball.visible=true;applyMap(M.map);setBall(M.ball,M.size);
  $('b').textContent=$('o').textContent=0;
  cam.clearViewOffset();document.body.classList.remove('menu','rp','pz');cam.up.set(0,1,0);state='play';cam.position.set(0,8,-50);say('');
}
function onEnd(){
  if(net==='guest'){net=null;snap=null;toMenu();note='The match ended.'}
  else if(net==='host'){const rc=cars.find(x=>x.remote);if(rc){rc.remote=false;rc.ai=true}net=null}
}
function guestStep(dt){
  const inp=curInput();jl=jl||!!inp.jump;netT+=dt;
  if(netT>.033){netT=0;if(hc&&hc.open)hc.send({t:'in',up:!!inp.up,down:!!inp.down,left:!!inp.left,right:!!inp.right,boost:!!inp.boost,jump:jl});jl=false}
  const d=snap;if(!d||!d.cars)return;
  const k=1-Math.pow(.0002,dt);
  d.cars.forEach((a,i)=>{
    const c=cars[i];if(!c||!a||a.length<16)return;
    const kk=Math.hypot(a[0]-c.p.x,a[1]-c.p.y,a[2]-c.p.z)>12?1:k;
    c.p.x+=(a[0]-c.p.x)*kk;c.p.y+=(a[1]-c.p.y)*kk;c.p.z+=(a[2]-c.p.z)*kk;
    c.g.position.copy(c.p);_q.set(a[3],a[4],a[5],a[6]);c.g.quaternion.slerp(_q,kk);
    c.u.x+=(a[7]-c.u.x)*kk;c.u.y+=(a[8]-c.u.y)*kk;c.u.z+=(a[9]-c.u.z)*kk;c.f.x+=(a[10]-c.f.x)*kk;c.f.y+=(a[11]-c.f.y)*kk;c.f.z+=(a[12]-c.f.z)*kk;
    c.u.normalize();c.f.normalize();c.boost=a[13];c.fl.visible=!!a[14];c.air=!!a[15];
  });
  const b=d.bl;if(b){const p=ball.position,kk=Math.hypot(b[0]-p.x,b[1]-p.y,b[2]-p.z)>12?1:k;
    const ox=p.x,oz=p.z;p.x+=(b[0]-p.x)*kk;p.y+=(b[1]-p.y)*kk;p.z+=(b[2]-p.z)*kk;ball.rotation.x+=(p.z-oz)*.4;ball.rotation.z-=(p.x-ox)*.4}
  $('b').textContent=d.hb;$('o').textContent=d.ho;$('t').textContent=d.tt;if($('msg').innerHTML!==d.m)$('msg').innerHTML=d.m;
  over=!!d.ov;gside=d.gs||1;state=d.st==='pause'?'play':d.st;
  if(d.ge!==lastGe){lastGe=d.ge;boom(ball.position.x,ball.position.y,ball.position.z,gside>0?0x1e90ff:0xff8a1e)}
}
S.accts=S.accts||{};if(S.name&&!S.accts[S.name])S.name='';
if(S.name)netStart();
applySet();showRoom();show('main');
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(net==='guest')guestStep(dt);else{step(dt);if(net==='host')hostSend(dt)}updBurst(dt);
  if(state!=='menu'){
    ball.rotation.x+=bv.z*dt*.4;ball.rotation.z-=bv.x*dt*.4;
    $('boost').style.setProperty('--p',me.boost+'%');$('bv').textContent=Math.round(me.boost);
  }
  updateCam(dt);renderer.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
